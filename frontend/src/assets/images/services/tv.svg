<svg
  viewBox="0 0 700 500"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Flat illustration of a smart TV being repaired"
 xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tvScreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="146" y="116" width="408" height="228" rx="6" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="700" height="500" fill="#eef2ff" />

  <!-- Soft floor shadow -->
  <ellipse cx="350" cy="430" rx="200" ry="16" fill="#c7d2fe" opacity="0.6" />

  <!-- TV stand -->
  <path
    d="M300,388 L262,426 M400,388 L438,426"
    stroke="#312e81"
    stroke-width="14"
    stroke-linecap="round"
  />
  <rect x="250" y="420" width="200" height="14" rx="7" fill="#312e81" />

  <!-- TV bezel -->
  <rect x="120" y="90" width="460" height="280" rx="18" fill="#1e1b4b" />

  <!-- Screen -->
  <rect x="146" y="116" width="408" height="228" rx="6" fill="url(#tvScreen)" />

  <!-- Screen scenery (clipped) -->
  <g clip-path="url(#screenClip)">
    <circle cx="500" cy="160" r="26" fill="#fbbf24" />
    <polygon points="146,344 236,232 300,300 366,210 454,344" fill="#a5b4fc" opacity="0.85" />
    <polygon points="146,344 210,268 260,320 320,250 400,344" fill="#818cf8" opacity="0.9" />
  </g>

  <!-- Screen glare -->
  <polygon points="180,116 240,116 160,220 140,220" fill="#ffffff" opacity="0.12" />

  <!-- Power / indicator light -->
  <circle cx="350" cy="358" r="5" fill="#a5b4fc" />

  <!-- Repair wrench badge -->
  <circle cx="522" cy="330" r="52" fill="#ffffff" />
  <circle cx="522" cy="330" r="52" fill="none" stroke="#c7d2fe" stroke-width="4" />
  <path
    d="M542 306a20 20 0 0 1-27 19l-24 24a7 7 0 0 1-10-10l24-24a20 20 0 0 1 25-27l-13 13 4 9 9 4 13-13a20 20 0 0 1-1 5z"
    fill="#4338ca"
  />

  <!-- Sparkle accents -->
  <path
    d="M584 250l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"
    fill="#fbbf24"
  />
  <path
    d="M602 300l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"
    fill="#fbbf24"
  />
</svg>
